<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Still Fresh</title>
        <script type="module" src="/src/components/site-navbar.js"></script>
        <script type="module" src="/src/components/site-top-navbar.js"></script>
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body>
        <main>
            <!--Name-->
            <h2 class="" id="profile-name">Loading</h2>
            <span id="role-badge"></span>

            <!--Stats-->
            <div class="" id="stats-container"></div>
            <!--Sign Out-->
            <button
                onclick="signOut()"
                class="">
                Sign Out
            </button>
        </main>
        <!--NavBar-->
        <site-top-navbar></site-top-navbar>
        <!--Footer-->
        <site-navbar></site-navbar>
        <script type="module" src="/src/main.js"></script>
        <script>
            //stat config per role
            const STAT_CONFIGS = {
                consumer: [
                    {label: 'All time saved', key: 'totalSaved', format: v => `$${(v || 0).toFixed(2)}`},
                    {label: 'Deals claimed', key: 'dealsClaimed', format: v => v ?? 0},
                    {label: 'Pending deals', key: 'pendingDeals', format: v => v ?? 0},
                    {label: 'Total waste prevented', key: 'wastePrevented', format: v => v ?? 0},
                    {label: 'Join date', key: 'createdAt', format: v => formatDate(v)},
                    {label: 'ID', key: '_id', format: v => v, mono: true},
                ],
                business: [
                    {label: 'Deals posted', key: 'dealsPosted', format: v => v ?? 0},
                    {label: 'Active listings', key: 'activeListings', format: v => v ?? 0},
                    {label: 'Total claimed', key: 'totalClaimed', format: v => v ?? 0},
                    {label: 'Waste prevented', key: 'wastePrevented', format: v => v ?? 0},
                    {label: 'Member since', key: 'createdAt', format: v => v ?? 0},
                    {label: 'ID', key: '_id', format: v => v, mono: true},
                ]
            }

            const ROLE_BADGE = {
                consumer: 
                    {label: 'Shopper', cls: ''},
                business:
                    {label: 'Business', cls: ''},
            }

            function formatDate(iso) {
                return new Date(iso).toLocaleDateString('en-GB', {
                    day: '2-digit', month: '2-digit', year: 'numeric'
                }).replace(/\//g, ' ');
            }

            function renderStats(user) {
                const role = user.role === 'business' ? 'business' : 'consumer' ;
                const configs = STAT_CONFIGS[role] ;
                const container = document.getElementById('stats-container') ;

                container.innerHTML = '' ;
                configs.forEach(({ label, key, format, mono }) => {
                    const row = document.createElement('div') ;
                    row.className = '';
                    row.innerHTML = `
                    
                    `;
                    container.appendChild(row);
                });
            }

            async function loadProfile() {
                try{
                    const res = await fetch('/api/me');
                    if (!res.ok) { window.location.href = '/'; return; }
                    const { user } = await res.json();

                    document.getElementById('profile-name').textContent = user.name || 'User';

                    const role    = user.role === 'business' ? 'business' : 'consumer' ;
                    const profileBadge = document.getElementById('role-badge') ;
                    profileBadge.textContent = ROLE_BADGE[role].label ;
                    profileBadge.className = `` ;

                    renderStats(user);
                    
                } catch(err) {
                    console.error("Failed to load Profile.")
                }
            }
        </script>    
    </body>
</html>
