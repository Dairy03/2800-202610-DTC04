<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Still Fresh</title>
        <script type="module" src="/src/components/site-navbar.js"></script>
        <script type="module" src="/src/components/site-top-navbar.js"></script>
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body class="min-h-screen bg-[#FFFBF4] flex flex-col max-w-sm mx-auto">
        <main class="flex-1 flex flex-col">
            <!--Name-->
            <h2 class="text-2xl font-bold text-gray-900 mb-1 my-8" id="profile-name">Loading</h2>
            <span id="role-badge"></span>

            <!--Stats-->
            <div class="w-full divide-y divide-[#248232] border-t border-[#248232]" id="stats-container"></div>

            <div>
                <div class="flex items-center justify-between py-4">
                    <div>
                        <p class="text-base text-gray-700">App tutorials</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input
                            type="checkbox"
                            id="tutorial-toggle"
                            class="sr-only peer"
                            onchange="onTutorialToggle(this.checked)"
                        />
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer
                                    peer-checked:bg-[#2BA84A]
                                    after:content-[''] after:absolute after:top-0.5 after:left-0.5
                                    after:bg-white after:rounded-full after:h-5 after:w-5
                                    after:transition-all peer-checked:after:translate-x-5">
                        </div>
                    </label>
                </div>
            </div>
            <!--Sign Out-->
            <button
                onclick="signOut()"
                class="mt-3 py-3 rounded-2xl border-2 bg-[#2BA84A] text-white hover:bg-[#FFFBF4] hover:text-green-600 transition-colors">
                Sign Out
            </button>
        </main>
        <!--NavBar-->
        <site-top-navbar></site-top-navbar>
        <!--Footer-->
        <site-navbar></site-navbar>
        <script type="module" src="/src/main.js"></script>
        <script>

            const API = 'http://localhost:3000';

            //stat config per role
            const STAT_CONFIGS = {
                user: [
                    {label: 'All time saved', key: 'totalSaved', format: v => `$${(v || 0).toFixed(2)}`},
                    {label: 'Deals claimed', key: 'dealsClaimed', format: v => v ?? 0},
                    {label: 'Pending deals', key: 'pendingDeals', format: v => v ?? 0},
                    {label: 'Total waste prevented', key: 'wastePrevented', format: v => v ?? 0},
                    {label: 'Join date', key: 'createdAt', format: v => formatDate(v)},
                    {label: 'ID', key: '_id', format: v => v, mono: true},
                ],
                business: [
                    {label: 'Deals posted', key: 'dealsPosted', format: v => v ?? 0},
                    {label: 'Active listings', key: 'activeListings', format: v => v ?? 0},
                    {label: 'Total claimed', key: 'totalClaimed', format: v => v ?? 0},
                    {label: 'Waste prevented', key: 'wastePrevented', format: v => v ?? 0},
                    {label: 'Member since', key: 'createdAt', format: v => formatDate(v)},
                    {label: 'ID', key: '_id', format: v => v, mono: true},
                ]
            }

            const ROLE_BADGE = {
                user: 
                    {label: 'user', cls: 'bg-green-100 text-green-800 max-w-18'},
                business:
                    {label: 'Business', cls: 'bg-red-100 text-red-800 max-w-18'},
            }

            function formatDate(iso) {
                return new Date(iso).toLocaleDateString('en-GB', {
                    day: '2-digit', month: '2-digit', year: 'numeric'
                }).replace(/\//g, ' ');
            }

            function renderStats(user) {
                const role = user.role === 'business' ? 'business' : 'user' ;
                const configs = STAT_CONFIGS[role] ;
                const container = document.getElementById('stats-container') ;

                container.innerHTML = '' ;
                configs.forEach(({ label, key, format, mono }) => {
                    const row = document.createElement('div') ;
                    row.className = 'flex items-center justify-between py-4';
                    row.innerHTML = `
                        <span class="text-base text-gray-700">${label}</span>
                        <span class="${mono ? 'text-sm text-gray-400 font-mono' : 'text-base font-semibold text-gray-900'}">${format(user[key])}</span>
                    `;
                    container.appendChild(row);
                });
            }

            async function loadProfile() {
                try{
                    const res = await fetch(`${API}/auth/me`, {
                        credentials: 'include', // sends session cookie so server knows who you are
                    });
                    if (!res.ok) { window.location.href = '/'; return; }
                    const { user } = await res.json();

                    document.getElementById('profile-name').textContent = `${user.fName || ''} ${user.lName || ''}`.trim() || 'User';

                    const role    = user.role === 'business' ? 'business' : 'user' ;
                    const profileBadge = document.getElementById('role-badge') ;
                    profileBadge.textContent = ROLE_BADGE[role].label ;
                    profileBadge.className = `text-xs font-medium px-3 py-1 rounded-full mb-8 ${ROLE_BADGE[role].cls}` ;

                    renderStats(user);
                    
                } catch(err) {
                    console.error("Failed to load Profile.")
                }
            }

            async function onTutorialToggle(enabled) {
                await fetch(`${API}/auth/tutorial-toggle`, {
                method:      'PATCH',
                credentials: 'include',
                headers:     { 'Content-Type': 'application/json' },
                body:        JSON.stringify({ tutorial_toggle: enabled }),
                });
            }

            async function signOut() {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = './login-page.html';
            }

            loadProfile();
        </script>    
    </body>
</html>
