<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="relative z-10 w-full max-w-sm">


        <!-- Logo/App Name -->
        <div class="text-center text-8xl mb-10 font-extrabold">
            <h1>Still</h1>
            <h1>Fresh</h1>
        </div>
        <!-- Card -->
        <div class="rounded-xl p-8" style="border: 1px solid black">
            <!-- Form Start -->
            <form id="login-form" class="space-y-5">
                
                <!-- Email -->
                <div>
                    <label class="flex items-center justify-between mb-2 font-semibold">Email: </label>
                    <input id="email" 
                    type="email" 
                    placeholder="youremail@example.com" 
                    required 
                    class="w-full rounded-xl px-4 py-3 pr-11"
                    style="border: 1px solid green;">
                </div>
                <!-- Password -->
                <div>
                    <div>
                        <label class="flex items-center justify-between mb-2 font-semibold">Password:</label>
                        <input id="password" 
                        type="password" 
                        placeholder="********" 
                        required
                        class="w-full rounded-xl px-4 py-3 pr-11"
                        style="border: 1px solid green;">
                    </div>
                </div>
                
                <div class="flex justify-center rounded-2xl">
                    <!-- Submit -->
                    <button
                        type="submit"
                        id="login-btn"
                        class="w-48 py-3 rounded-xl text-sm mt-2 border border-green-600 text-green-600 hover:bg-green-600 hover:text-white transition-colors"
                    >
                        Sign In
                    </button>
                </div>
            
            <!-- Form End -->
        </form>
        <!-- Card End -->
        
        
        <!-- Sign Up Link -->
        <p class="text-center text-xs mt-6">
            Don't have an account?
            <a href="signup-page.html" class="text-green-500 hover:text-green-800 ml-1">Create one</a>
        </p>
    </div>
    <p class="text-center text-xs mt-6">
        Have a Business?
        <a href="" class="text-green-500 hover:text-green-800 ml-1">Register</a>
    </p>

    </div>
    <!--NavBar-->
    <!--Footer-->
</body>
</html>
