<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loader Splash Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<div class="min-h-screen bg-white p-10">
  <h1 class="text-2xl font-bold text-gray-800 mb-4">My Website</h1>
  <p class="text-gray-500 mb-6">Welcome to my page. This content is behind the loading screen.</p>
  <div class="grid grid-cols-3 gap-4">
    <div class="bg-gray-200 h-32 rounded-lg"></div>
  </div>
</div>

<style>
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .spinner {
    animation: spin 1s linear infinite;
  }
</style>

<div id="loading-screen" class="fixed inset-0 bg-gray-100/80 backdrop-blur-[2px] flex flex-col items-center justify-center gap-4 z-50 transition-opacity duration-300">
  <div class="spinner w-10 h-10 rounded-full border-4 border-gray-300 border-t-gray-600"></div>
  <span class="text-sm text-gray-500">Loading...</span>
</div>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loading-screen');
      loader.classList.add('opacity-0', 'pointer-events-none');
    }, 3000);
  });
</script>
</html>
