<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still Fresh - Instructions</title>
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-top-navbar.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="min-h-screen flex items-start justify-center px-4 pb-24">
    <site-top-navbar></site-top-navbar>
    <a id="back-link" href="recipe.html" class="btn absolute left-3 top-0 text-3xl z-100 pt-1">❮</a>

    <div class="relative z-10 w-full max-w-sm pt-4">
      <!-- Loading state -->
      <div id="loading-state" class="flex flex-col items-center justify-center py-20">
        <div class="w-10 h-10 border-4 border-gray-200 border-t-[#2BA84A] rounded-full animate-spin"></div>
        <p class="text-sm text-gray-500 mt-3">Loading instructions...</p>
      </div>

      <!-- Content -->
      <div id="instructions-content" class="hidden">
        <h1 class="text-2xl font-bold text-[#2D3A3A] mb-6">
          Instructions for <span id="recipe-name">&lt;recipe&gt;</span>
        </h1>

        <div id="steps-container" class="space-y-8"></div>

        <a id="ingredients-link" href="#" class="block mt-8">
          <button class="w-full py-3 rounded-xl text-lg bg-white text-[#2BA84A] border-[#2BA84A] border-2 font-bold">
            View Ingredients
          </button>
        </a>
      </div>

      <!-- Error state -->
      <div id="error-state" class="hidden text-center py-20">
        <p class="text-red-700 mb-2">Recipe not found</p>
        <a href="recipes.html" class="text-[#2BA84A] font-semibold">Back to recipes</a>
      </div>
    </div>

    <script type="module" src="./src/instructions-page.js"></script>
  </body>
</html>
