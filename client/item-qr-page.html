<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still Fresh - Item QR</title>
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-top-navbar.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      #qr-code-image canvas,
      #qr-code-image img { width: 200px !important; height: 200px !important; display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 0.8s linear infinite; }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center px-4">
    <site-top-navbar></site-top-navbar>
    <a href="item-confirm-page.html" class="btn absolute left-3 top-0 text-3xl z-100 pt-1">❮</a>

    <div class="relative z-10 w-full max-w-sm">
      <div class="rounded-xl p-8 pt-0 text-center">

        <h1 class="text-2xl">Show this code at checkout</h1>

        <div id="qr-loading" class="flex flex-col items-center justify-center py-6 gap-2">
          <div class="w-10 h-10 rounded-full border-4 border-gray-200 border-t-green-600 spin"></div>
          <p class="text-sm text-gray-400">Loading QR code…</p>
        </div>

        <div id="qr-error" class="flex-col items-center justify-center py-6 gap-2" style="display:none">
          <p class="text-sm font-semibold text-red-500">Failed to load QR code</p>
          <button onclick="renderQRPage()" class="text-sm text-green-600 underline">Try again</button>
        </div>

        <div class="flex items-center justify-center">
          <div class="relative p-3">
            <div id="qr-code-image" class="rounded-xl" style="display:none"></div>
            <div id="expired-overlay"
              class="absolute inset-0 bg-white/60 rounded-xl flex items-center justify-center"
              style="display:none">
              <span class="bg-red-500 text-white text-sm font-semibold px-4 py-1.5 rounded-md">Expired</span>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <div class="text-center">
            <div class="text-center p-2">
              <p>SF-DEAL-0A3F7B</p>
            </div>
          </div>

          <div class="rounded-xl p-2 font-bold text-[#979797]" style="border: 2px solid gray">
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Item</p>
              <p id="item-name" class="text-[#2D3A3A]"></p>
            </div>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Store</p>
              <p class="text-[#2D3A3A]"><span id="item-location">n/a</span></p>
            </div>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>You save</p>
              <p class="text-[#2D3A3A]">$<span id="item-price-after"></span></p>
            </div>
          </div>

          <div>
            <a href="">
              <button
                type="submit"
                id="share-deal-btn"
                class="w-full py-3 rounded-xl text-2xl mt-2 bg-[#2BA84A] text-white font-bold"
              >
                Share Deal
              </button>
            </a>

            <a href="">
              <button
                type="click"
                id="get-directions-btn"
                class="w-full py-3 rounded-xl text-lg mt-2 bg-white text-[#2BA84A] border-[#2BA84A] border-2 font-bold"
              >
                Get Directions
              </button>
            </a>
          </div>
        </div>
      </div>

      <div class="hidden">
        <div id="item-distance"></div>
        <div id="item-price-before"></div>
        <div id="item-discount"></div>
        <div id="item-expiration"></div>
        <div id="item-money-saved"></div>
        <div id="redeem-by"></div>
      </div>
    </div>

    <script src="./src/item-qr-page.js"></script>
  </body>
</html>
