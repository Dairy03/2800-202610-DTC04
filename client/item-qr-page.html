<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-top-navbar.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center px-4">
    <site-top-navbar></site-top-navbar>
    <a href="item-confirm-page.html" class="btn absolute left-3 top-0 text-3xl z-100 pt-1">❮</a>
    <div class="relative z-10 w-full max-w-sm">
      <!-- Card -->
      <div class="rounded-xl p-8 pt-0 text-center">
        <!-- card Start -->
        <h1 class="text-2xl">Show this code at checkout</h1>

        <div class="flex items-center justify-center">
          <!-- item image -->
          <img
            id="qr-code-image"
            class="rounded-xl h-50 w-50 p-3"
            src="images/qr-code.png"
          />
        </div>
        <div class="space-y-3">
          <div class="text-center">
            <div class="text-center p-2">
              <p>SF-DEAL-0A3F7B</p>
            </div>
          </div>

          <div class="rounded-xl p-2" style="border: 2px solid gray">
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Item</p>
              <p id="item-name" class="font-bold"></p>
            </div>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Store</p>
              <p class="font-bold"><span id="item-location">n/a</span></p>
            </div>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>You save</p>
              <p class="font-bold">$<span id="item-price-after"></span></p>
            </div>
          </div>

          <!-- share deal -->
          <div>
          <a href="">
            <button
              type="submit"
              id="share-deal-btn"
              class="w-full py-3 rounded-xl text-2xl mt-2 bg-[#2BA84A] text-white font-bold"
            >
              Share Deal
            </button>
          </a>

            <!-- get directions -->
          <a href="">
            <button
              type="click"
              id="get-directions-btn"
              class="w-full py-3 rounded-xl text-lg mt-2 bg-white text-[#2BA84A] border-[#2BA84A] border-2 font-bold"
            >
              Get Directions
            </button>
          </a>
          </div>
        </div>
      </div>

      <!--NavBar-->
      <!--Footer-->

      <!-- ignore these -->
      <div class="hidden">
        <div id="item-distance"></div>
        <div id="item-price-before"></div>
        <div id="item-discount"></div>
        <div id="item-expiration"></div>
        <div id="item-money-saved"></div>
        <div id="redeem-by"></div>
      </div>
    </div>
    <script type="module" src="./src/item-page.js"></script>
  </body>
</html>
