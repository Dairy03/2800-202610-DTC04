<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still Fresh - Recipe</title>
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-top-navbar.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="min-h-screen flex items-start justify-center px-4 pb-24">
    <site-top-navbar></site-top-navbar>
    <a href="recipes.html" class="btn absolute left-3 top-0 text-3xl z-100 pt-1">❮</a>

    <div class="relative z-10 w-full max-w-sm pt-4">
      <!-- Loading state -->
      <div id="loading-state" class="flex flex-col items-center justify-center py-20">
        <div class="w-10 h-10 border-4 border-gray-200 border-t-[#2BA84A] rounded-full animate-spin"></div>
        <p class="text-sm text-gray-500 mt-3">Loading recipe...</p>
      </div>

      <!-- Recipe content -->
      <div id="recipe-content" class="hidden">
        <!-- Recipe image -->
        <div class="rounded-xl bg-gray-500 h-56 flex items-center justify-center mb-4 overflow-hidden">
          <img id="recipe-image" alt="" class="w-full h-full object-cover hidden" />
          <span id="recipe-image-fallback" class="text-white font-bold text-2xl text-center px-4">RECIPE IMAGE</span>
        </div>

        <!-- Recipe header -->
        <div class="mb-4">
          <h1 id="recipe-name" class="text-2xl font-bold text-[#2D3A3A]"></h1>
          <div class="flex items-start justify-between mt-2">
            <div>
              <p class="text-3xl font-bold text-[#2BA84A]"><span id="recipe-time">—</span> minutes</p>
            </div>
            <div class="text-right">
              <p class="text-sm text-[#2D3A3A] font-semibold mb-1">Difficulty:</p>
              <span id="recipe-difficulty" class="inline-block bg-[#2BA84A] text-white text-sm font-semibold px-4 py-1 rounded-full">—</span>
            </div>
          </div>
        </div>

        <hr class="border-gray-300 mb-3" />

        <!-- Stats -->
        <div class="space-y-2 mb-5">
          <div class="flex justify-between items-center">
            <span class="text-[#2D3A3A]">Step count</span>
            <span id="recipe-step-count" class="font-bold text-[#2D3A3A]">—</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-[#2D3A3A]">Typical total cost</span>
            <span class="font-bold text-[#2D3A3A]">$<span id="recipe-cost">—</span></span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-[#2D3A3A]">Serves</span>
            <span id="recipe-serves-2" class="font-bold text-[#2D3A3A]">—</span>
          </div>
        </div>

        <!-- Actions -->
        <a id="start-recipe-link" href="#">
          <button
            class="w-full py-3 rounded-xl text-2xl bg-[#2BA84A] text-white font-bold mb-2"
          >
            Start recipe
          </button>
        </a>
        <a id="view-ingredients-link" href="#">
          <button
            class="w-full py-3 rounded-xl text-lg bg-white text-[#2BA84A] border-[#2BA84A] border-2 font-bold"
          >
            View Ingredients
          </button>
        </a>
      </div>

      <!-- Error state -->
      <div id="error-state" class="hidden text-center py-20">
        <p class="text-red-700 mb-2">Recipe not found</p>
        <a href="recipes.html" class="text-[#2BA84A] font-semibold">Back to recipes</a>
      </div>
    </div>

    <script type="module" src="./src/recipe-detail-page.js"></script>
  </body>
</html>
