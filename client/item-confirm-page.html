<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-top-navbar.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center px-4">
    <site-top-navbar></site-top-navbar>
    <a href="" class="btn absolute left-3 top-0 text-5xl z-100"> ←</a>
    <div class="relative z-10 w-full max-w-sm">
      <!-- Card -->
      <div class="rounded-xl p-8 pt-0">
        <!-- card Start -->
        <div class="flex items-center justify-center">
          <!-- item image -->
          <img
            class="rounded-xl h-50 w-50"
            src="images/confirm_checkmark.png"
          />
        </div>
        <div class="space-y-3">
          <div class="text-center">
            <h1 class="text-2xl font-bold">Deal Confirmed!</h1>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>
                Your <span id="item-name">n/a</span> deal at
                <span id="item-location">n/a</span> has been reserved.
              </p>
            </div>
          </div>

          <div class="rounded-xl p-2" style="border: 2px solid gray">
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Expires</p>
              <p class="font-bold">
                in <span id="item-expiration">0</span> day(s)
              </p>
            </div>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Quantity left</p>
              <p class="font-bold">x available</p>
            </div>
            <div class="flex flex-nowrap justify-between items-center p-2">
              <p>Carbon Saved</p>
              <p class="font-bold">0.0 kg CO2</p>
            </div>
          </div>

          <!-- view qr code -->
          <div>
            <button
              type="submit"
              id="View-QR-code-btn"
              class="w-full py-3 rounded-xl text-2xl mt-2 bg-[#2BA84A] text-white font-bold"
            >
              View QR code
            </button>

            <!-- cancel deal -->
            <button
              type="click"
              id="cancel-deal-btn"
              class="w-full py-3 rounded-xl text-lg mt-2 bg-white text-[#2BA84A] border-[#2BA84A] border font-bold"
            >
              Cancel Deal
            </button>
          </div>
        </div>
      </div>

      <!--NavBar-->
      <!--Footer-->
      <site-navbar></site-navbar>

      <!-- ignore these -->
      <div class="hidden">
        <div id="item-distance"></div>
        <div id="item-price-after"></div>
        <div id="item-price-before"></div>
        <div id="item-discount"></div>
      </div>
    </div>
    <script type="module" src="./src/item-page.js"></script>
  </body>
</html>
