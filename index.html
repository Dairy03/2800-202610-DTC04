<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!--AI-generated profile page for general template-->

<body class="bg-gray-100 min-h-screen flex text-gray-900 font-sans">

  <aside class="w-64 bg-white border-r border-gray-200 flex-col justify-between hidden md:flex fixed h-full z-20">
    <div>
      <div class="p-8 pb-12">
        <p class="text-2xl font-bold text-gray-900">Brand Name</p>
        <p class="text-sm text-gray-500 mt-1">Subtitle</p>
      </div>

      <nav class="px-4 space-y-2">
        <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-gray-100 rounded-2xl transition-colors group">
          <svg class="w-6 h-6 stroke-gray-400 group-hover:stroke-gray-600 fill-none transition-colors" style="stroke-width:1.8" viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="text-[15px] font-medium text-gray-500">Menu Item 1</span>
        </a>

        <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-gray-100 rounded-2xl transition-colors group">
          <svg class="w-6 h-6 stroke-gray-400 group-hover:stroke-gray-600 fill-none transition-colors" style="stroke-width:1.8" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span class="text-[15px] font-medium text-gray-500">Menu Item 2</span>
        </a>

        <a href="#" class="flex items-center gap-4 px-4 py-3 hover:bg-gray-100 rounded-2xl transition-colors group">
          <svg class="w-6 h-6 stroke-gray-400 group-hover:stroke-gray-600 fill-none transition-colors" style="stroke-width:1.8" viewBox="0 0 24 24">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span class="text-[15px] font-medium text-gray-500">Menu Item 3</span>
        </a>

        <a href="#" class="flex items-center gap-4 px-4 py-3 bg-gray-200 rounded-2xl transition-colors">
          <svg class="w-6 h-6 stroke-gray-800 fill-none" style="stroke-width:1.8" viewBox="0 0 24 24">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
          <span class="text-[15px] font-semibold text-gray-800">Active Menu Item</span>
        </a>
      </nav>
    </div>

  </aside>

  <main class="flex-1 ml-0 md:ml-64 flex flex-col min-h-screen relative">
    
    <div class="absolute top-8 right-10 z-20">
      <button class="w-12 h-12 rounded-full bg-gray-800 hover:bg-gray-900 transition-colors flex items-center justify-center shadow-lg border-0 cursor-pointer">
        <svg class="w-5 h-5 stroke-white fill-none stroke-2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </div>

    <div class="max-w-6xl w-full mx-auto px-10 pt-20 relative z-10 pb-16">
      
      <div class="flex items-center gap-6 mb-12">
        <div class="w-[140px] h-[140px] rounded-full bg-gray-400 border-8 border-gray-100 flex items-center justify-center text-white text-4xl font-bold" style="box-shadow: 0 8px 30px rgba(0,0,0,0.08);">UN
        </div>
        <div class="w-full max-w-sm">
          <h1 class="text-4xl font-bold text-gray-900 mb-2">User Name</h1>
          <p class="text-base text-gray-500">User description or bio goes here</p>
        </div>
      </div>

      <div class="bg-white rounded-[2.25rem] p-8 border border-gray-200 min-h-[500px]">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-2xl font-bold text-gray-900">Main Section Title</h2>
          <button class="text-gray-800 text-sm font-semibold hover:underline">View All</button>
        </div>
        
        <div class="space-y-4">
          <div class="h-[100px] bg-gray-100 rounded-2xl w-full flex items-center px-6 text-gray-500">Content Block 1</div>
          <div class="h-[100px] bg-gray-100 rounded-2xl w-full flex items-center px-6 text-gray-500">Content Block 2</div>
          <div class="h-[100px] bg-gray-100 rounded-2xl w-full flex items-center px-6 text-gray-500">Content Block 3</div>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
